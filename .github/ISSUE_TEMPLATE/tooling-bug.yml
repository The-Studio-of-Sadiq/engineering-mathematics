name: Tooling bug
description: Something wrong with the PDF build, figure scripts, Desmos rendering, navigation tools or MCP server.
title: "[Tooling] "
labels: ["tooling"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - PDF build (pdf/)
        - Figure scripts (figures/)
        - Desmos graph rendering (Obsidian plugin or PDF)
        - Navigation and checks (tools/)
        - MCP server (mcp-server/)
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what you expected, and what you got (paste the error).
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, Node 22, Chrome 140"
